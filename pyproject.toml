[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpdp-manager"
version = "1.2.2"
description = "PySide6 GUI aplikace pro správu vedení bakalářských a diplomových prací."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "safronus" }]
keywords = ["education", "thesis", "supervisor", "pyside6", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Czech",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "spylls>=0.1.7",  # čistě pythonní hunspell — kontrola pravopisu posudku
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "Pillow>=10.0",
]

[project.scripts]
bpdp-manager = "bpdpmanager.__main__:main"

[project.urls]
Repository = "https://github.com/safronus/bpdp-manager"

[tool.hatch.build.targets.wheel]
packages = ["src/bpdpmanager"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
