# Automatický build spustitelné aplikace + release.
#
# Při každém pushi do main:  lint (ratchet) → testy → build .app/.dmg (vč. smoke
# testu zabalené appky) → artefakt ke stažení.
# Když tag vX.Y.Z pro aktuální __version__ ještě neexistuje, navíc vytvoří tag +
# GitHub Release s .dmg a poznámkami ze sekce v CHANGELOG.md. Release tedy vzniká
# automaticky jen při změně verze (bump v src/bpdpmanager/__init__.py).
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # vytvoření tagu + GitHub Release (výchozí token je jen read)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # rozběhnutý release nepřerušovat

jobs:
  macos:
    name: macOS arm64 — lint, testy, build, release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      # Stávající dluh; počet smí jen klesat (po snížení baseline aktualizovat).
      # Verze ruff je zafixovaná v pyproject.toml (dev) — jediný zdroj pravdy.
      RUFF_BASELINE: "334"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ratchet — počet chyb nesmí růst)
        run: |
          n=$(ruff check src tests --output-format json --exit-zero \
              | python -c "import json, sys; print(len(json.load(sys.stdin)))")
          echo "ruff: $n chyb (baseline $RUFF_BASELINE)"
          if [ "$n" -gt "$RUFF_BASELINE" ]; then
            echo "::error::Přibyly lint chyby: $n > $RUFF_BASELINE"
            ruff check src tests --output-format concise | tail -40
            exit 1
          fi

      - name: Testy
        run: python -m pytest -q

      - name: Build .app + .dmg (vč. smoke testu zabalené aplikace)
        id: build
        env:
          PYTHON: python
          BUILD_ROOT: ${{ runner.temp }}/bpdp-build
        run: scripts/build_macos.sh

      - name: Artefakt (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.dmg_name }}
          path: ${{ steps.build.outputs.dmg }}
          retention-days: 30
          if-no-files-found: error

      - name: Release (jen když tag pro tuto verzi ještě neexistuje)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          DMG: ${{ steps.build.outputs.dmg }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} už existuje — nový release se nevytváří."
            exit 0
          fi
          python scripts/release_notes.py "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh release create "v${VERSION}" "${DMG}" \
            --target "${GITHUB_SHA}" \
            --title "BPDPManager ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          echo "✅ Vydáno: v${VERSION}"
